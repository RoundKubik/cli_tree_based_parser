[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-vrp-parser"
version = "0.1.0"
description = "Extensible parser for Huawei VRP command patterns and configurations"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Huawei VRP parser contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
vrp-parser = "vrp_parser.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
mypy_path = "src"
python_version = "3.13"
strict = true
packages = ["vrp_parser", "vrp_parser_automaton", "vrp_format_matcher"]
